light:
# MARK: CC output
  - platform: monochromatic
    icon: mdi:led-strip
    output: CC_channel
    name: "Current limited channel"
    id: ledstrip_cc
    restore_mode: RESTORE_DEFAULT_OFF
    gamma_correct: 1.0
    web_server:
      sorting_weight: 15

  ############################## Workbench Lights ##############################
  - platform: rgb
    name: "Workbench Lights"
    red: red_channel
    green: green_channel
    blue: blue_channel
    id: workbench_lights
# MARK: WS2812B
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO32
    num_leds: 6
    chipset: ws2812
    name: "WS2812B LEDs"
    id: ws2812b_4
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_weight: 10
    effects:
      - addressable_lambda:
          name: "Moonlight"
          update_interval: 100ms
          lambda: |-
            // Get current time for smooth transitions
            auto time = id(get_current_time)();
            if (!time.is_valid()) {
              return;
            }
            
            // Create a slow breathing effect based on time
            float brightness = (sin(time.second * 0.05) * 0.3) + 0.4; // Gentle breathing between 0.1-0.7
            
            // Moonlight colors - soft blue-white
            float r = brightness * 0.706; // 180/255
            float g = brightness * 0.784; // 200/255  
            float b = brightness * 1.0;   // 255/255
            
            // Apply to all LEDs with slight variation
            for (int i = 0; i < it.size(); i++) {
              float led_variation = 1.0 + (sin(time.second * 0.03 + i * 0.5) * 0.1); // Slight individual variation
              
              // Convert to 0-255 range and ensure minimum threshold
              int red = max(28, (int)(r * led_variation * 255));
              int green = max(28, (int)(g * led_variation * 255));
              int blue = max(28, (int)(b * led_variation * 255));
              
              it[i] = Color(red, green, blue);
            }
            
      - addressable_lambda:
          name: "Moonlight Shimmer"
          update_interval: 150ms
          lambda: |-
            // More dynamic moonlight with shimmer effect
            auto time = id(get_current_time)();
            if (!time.is_valid()) {
              return;
            }
            
            for (int i = 0; i < it.size(); i++) {
              // Each LED has its own shimmer pattern
              float phase = time.second * 0.08 + (i * 1.57); // Different phase for each LED
              float brightness = (sin(phase) * 0.25) + 0.35; // Base brightness 0.1-0.6
              
              // Add occasional brighter "twinkles"
              float twinkle = sin(time.second * 0.3 + i * 2.1);
              if (twinkle > 0.8) {
                brightness += 0.2;
              }
              
              // Clamp brightness
              brightness = max(0.05f, min(0.8f, brightness));
              
              // Moonlight color palette
              float r = brightness * 0.627; // 160/255
              float g = brightness * 0.745; // 190/255
              float b = brightness * 1.0;   // 255/255
              
              // Convert to 0-255 range and ensure minimum threshold
              int red = max(28, (int)(r * 255));
              int green = max(28, (int)(g * 255));
              int blue = max(28, (int)(b * 255));
              
              it[i] = Color(red, green, blue);
            }

      - addressable_lambda:
          name: "Soft Moonlight"
          update_interval: 100ms
          lambda: |-
            static float time = 0.0;
            time += 0.08;

            for (int i = 0; i < it.size(); i++) {
              // Map to 4x4 matrix
              int x = i % 4;
              int y = i / 4;

              // Create soft pulsing waves with more variation
              float phase = time + x * 0.8 + y * 0.6;
              float brightness = (sin(phase) + 1.0) / 2.0;  // Normalize to [0, 1]
              brightness = brightness * 0.4 + 0.2;  // Increased range: 20%–60%

              // Cool bluish moonlight tone
              float r = brightness * 0.5;
              float g = brightness * 0.6;
              float b = brightness * 1.0;

              // Convert to 0-255 range and ensure minimum threshold
              int red = max(28, (int)(r * 255));
              int green = max(28, (int)(g * 255));
              int blue = max(28, (int)(b * 255));

              it[i] = Color(red, green, blue);
            }

      - addressable_lambda:
          name: "Marine Moonlight"
          update_interval: 150ms
          lambda: |-
            static float time = 0.0;
            time += 0.05;

            for (int i = 0; i < it.size(); i++) {
              // Map LEDs into 4x4 logical grid
              int x = i % 4;
              int y = i / 4;

              // Create wave shimmer effect with multiple wave patterns
              float wave1 = sin(time + x * 0.4 + y * 0.6);
              float wave2 = sin(time * 1.3 + x * 0.7 + y * 0.3);
              float combined_wave = (wave1 + wave2 * 0.5) / 1.5;
              
              float brightness = (combined_wave + 1.0) / 2.0;  // Normalize [0–1]
              brightness = brightness * 0.35 + 0.15;  // Increased range: 15%–50%

              // Moonlight color (deep blue tint)
              float r = brightness * 0.2;
              float g = brightness * 0.4;
              float b = brightness * 1.0;

              // Convert to 0-255 range and ensure minimum threshold
              int red = max(28, (int)(r * 255));
              int green = max(28, (int)(g * 255));
              int blue = max(28, (int)(b * 255));

              it[i] = Color(red, green, blue);
            }


# Add a time component to keep track of time
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - logger.log: "Time synced from Home Assistant"

  - platform: sntp
    id: sntp_time
    timezone: America/Sao_Paulo
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return !id(homeassistant_time).now().is_valid();'
            then:
              - logger.log: "Time synced from SNTP (fallback)"
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org

# Add persistent storage for configuration
globals:
 ################################# System Time #################################
  - id: get_current_time
    type: 'std::function<esphome::ESPTime()>'
    restore_value: false
    initial_value: |-
      []() -> esphome::ESPTime {
        // Priority 1: Home Assistant time
        auto ha_time = id(homeassistant_time).now();
        if (ha_time.is_valid()) {
          return ha_time;
        }
        
        // Priority 2: SNTP time
        auto ntp_time = id(sntp_time).now();
        if (ntp_time.is_valid()) {
          return ntp_time;
        }
        
        // Return invalid time if none available
        return {};
      }

  - id: lunar_phase
    type: float
    restore_value: false
    initial_value: '1.0'
  - id: config_version
    type: int
    restore_value: yes
    initial_value: "1"

# MARK: Text Sensors
text_sensor:
 ################################# Time Source #################################
  - platform: template
    name: "Active Time Source"
    lambda: |-
      if (id(homeassistant_time).now().is_valid()) {
        return {"Home Assistant"};
      } else if (id(sntp_time).now().is_valid()) {
        return {"SNTP"};
      } else {
        return {"None"};
      }
    update_interval: 30s
    entity_category: diagnostic
    icon: mdi:home-clock-outline
    web_server:
      sorting_weight: 5

# MARK: Condensed Time
  - platform: template
    name: "Current Date & Time"
    id: current_time_condensed
    internal: true
    lambda: |-
      auto time = id(get_current_time)();
      if (!time.is_valid()) {
        return {"Time not available"};
      }
      return time.strftime("%H:%M:%S %d/%m/%Y");
    update_interval: 1s
    icon: mdi:clock-outline
    web_server:
      sorting_weight: 4

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
      internal: true
    mac_address:
      name: "MAC Address"
      internal: true