;? Standalone PlatformIO project for the button probe.
;! This is a SEPARATE project on purpose. It used to be an [env:C3-PROBE] section
;! of the firmware's own platformio.ini that set `src_dir = tools/button_probe`,
;! and that silently did nothing: PlatformIO only accepts `src_dir` in the global
;? [platformio] section, so the environment kept building src/ and
;* `pio run -e C3-PROBE -t upload` flashed the WHOLE FIRMWARE instead of the
;! probe - a diagnostic that reports success while testing the wrong binary.
;?
;? Build and flash it with, from this directory:
;?     pio run -t upload --upload-port COM6
;* or from the firmware directory:
;?     pio run -d tools/button_probe -t upload --upload-port COM6
;?
;? The platform packages are pinned to the same framework as the firmware so the
;? probe runs against the same core, and so it builds offline from the same cache.
[env:probe]
platform = espressif32@6.11.0
platform_packages =
  	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  	framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
board = esp32-c3-devkitm-1
board_build.flash_mode = qio
framework = arduino
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_CDC_ON_BOOT=1
upload_speed = 460800
monitor_speed = 115200
