[env]
platform = espressif32@6.11.0
platform_packages = 
  	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  	framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
	;tool-esptoolpy @ 4.7.6 
	;tool-mklittlefs @ 3.2.0 
	;tool-riscv32-esp-elf-gdb @ 11.2.0+20220823 
	;tool-xtensa-esp-elf-gdb @ 11.2.0+20230208 
	;toolchain-riscv32-esp @ 12.2.0+20230208
board = esp32-c3-devkitm-1
board_build.flash_mode = qio
;* Our own partition table instead of the core's default.csv, which reserved 1.375 MB
;? for a SPIFFS partition this firmware never mounts. The two OTA slots take that
;! space, going from 1.25 MB to 1.9375 MB each - app headroom from 68 KB to ~770 KB.
;* See the table itself for the layout, why NVS is left exactly where it was, and the
;? one-time USB reflash this needs (app1 moves, otadata is rewritten by the upload).
board_build.partitions = partitions_lightpack.csv
board_upload.before_reset = usb_reset
framework = arduino ;@ 3.0.4+sha.147836c 
;upload_port = /dev/cu.usbmodem323101
;upload_protocol = esp-builtin
;upload_port = COM6
;upload_protocol = espota
;upload_port = 192.168.2.192
upload_speed = 460800
;upload_speed = 512000
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; Drops the .eh_frame unwind tables: ~49 KB sitting in an app partition that
	; is otherwise ~98% full. There is no C++ throw, try or catch anywhere in
	; this firmware, so the tables were only ever dead weight.
	;! Both flags are needed and the ORDER matters. The platform passes
	;! -fexceptions, and while exceptions are on GCC emits .eh_frame for every
	;! C++ function no matter what the unwind-table flag says, which is why
	;! -fno-asynchronous-unwind-tables on its own changes nothing. build_flags
	;! come after the platform's, so -fno-exceptions wins. A throw that escapes
	;! from a prebuilt library (libstdc++ is linked) now aborts instead of
	;! unwinding - the same outcome as an uncaught exception on a device with no
	;! handler, but not a caught one.
	-fno-exceptions
	-fno-asynchronous-unwind-tables

lib_deps = 
	Wire
	SPI
	adafruit/Adafruit ADS1X15@^2.4.0
	adafruit/Adafruit BusIO@^1.14.5
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit NeoPixel@^1.12.0
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit MPU6050@^2.2.9
	;madhephaestus/ESP32Servo


[env:C3-OTA]
upload_protocol = espota
upload_port = lightpack.local
lib_deps = 
	${env.lib_deps}

[env:C3-USB]
;upload_port = 192.168.2.140
lib_deps = 
	${env.lib_deps}


;* ---------------------- DIAGNOSTICS ----------------------
;? The button probe is a SEPARATE project, not an environment of this one:
;?     pio run -d tools/button_probe -t upload --upload-port COM6
;! It used to live here as [env:C3-PROBE] with `src_dir = tools/button_probe`, and
;? that key is only honoured in the global [platformio] section - PlatformIO warns
;? "Ignore unknown configuration option `src_dir`" and builds src/ anyway, so that
;! environment flashed the full firmware while claiming to be a diagnostic. A
;* separate project is the only way to point a build at another source tree.
;? See tools/button_probe/src/main.cpp for how to read its output.
